name: Build Wireless Link Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/zephyrproject-rtos/ci:v0.27.3

    env:
      NRF_CONNECT_SDK_VERSION: v3.1.1
      ZEPHYR_SDK_INSTALL_DIR: /opt/toolchains/zephyr-sdk-0.17.0

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Initialize West Workspace
        run: |
          # Initialize west
          west init -m https://github.com/nrfconnect/sdk-nrf.git --mr $NRF_CONNECT_SDK_VERSION wirelesslink
          cd wirelesslink
          
          # Fetch dependencies
          west update
          
          # Export Zephyr CMake packages so the build system can find them
          west zephyr-export      

      - name: Build firmware
        run: |
          cd wirelesslink
          west build -p -b cosmiic_wireless_link/nrf5340/cpuapp \
            -d build \
            -- -DBOARD_ROOT=$(pwd)/../wirelesslink

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-build
          path: |
            wirelesslink/build/wirelesslink/zephyr/zephyr.signed.bin
            wirelesslink/build/dfu_application.zip
          retention-days: 90

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: wirelesslink/build/

      - name: Generate build summary
        if: always()
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          if [ -f wirelesslink/build/wirelesslink/zephyr/zephyr.signed.bin ]; then
            echo "✅ Firmware build successful" >> $GITHUB_STEP_SUMMARY
            ls -lh wirelesslink/build/zephyr/zephyr.* >> $GITHUB_STEP_SUMMARY || true
          else
            echo "❌ Firmware build failed" >> $GITHUB_STEP_SUMMARY
          fi
